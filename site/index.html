# Slide 1: Title

## PawPal+ AI Pet Care Scheduler

- Extending a pet care scheduling app with Google Gemini 2.5 Flash AI recommendations
- Original base project: scheduling assistant with recurring tasks, priority ordering, and conflict detection
- New extension: AI-powered task suggestions, JSON persistence, and reliability handling

**Image:** `assets/pic1.jpg` (home screen or main UI screenshot)

---

# Slide 2: Original Project and Scope

## Base Project Context

- Goal: build a pet care scheduler that helps owners manage tasks and routines
- Capabilities:
  - Add care tasks with duration and priority
  - Schedule tasks within owner available time
  - Detect and report scheduling conflicts
  - Support daily and weekly recurrence
- This made a strong foundation for adding AI intelligence

**Image:** `assets/pic2.jpg` (task creation or schedule page screenshot)

---

# Slide 3: New AI Extension

## What was added

- Gemini 2.5 Flash powered task recommendations
- Personalized suggestions based on pet profile and owner availability
- Structured JSON output with validation
- Fallback and error handling when AI output is malformed

## Why it matters

- Helps users discover useful care tasks they may miss
- Makes schedule planning more complete and adaptive

**Image:** `assets/pic3a.jpg` or `assets/pic3b.jpg` (AI recommendation UI)

---

# Slide 4: System Diagram

## Main components

- **Data Retriever / Loader**: loads saved pet, owner, and task data from JSON
- **Agent**: AI recommendation engine using Gemini 2.5 Flash
- **Scheduler**: builds schedules, detects conflicts, and explains decisions
- **Evaluator / Tester**: validates behavior through automated tests and error handling

## Data flow

- Input → owner info, pet profile, tasks, saved data
- Process → load data → generate AI suggestions → schedule tasks → detect conflicts → save data
- Output → optimized schedule, recommendations, explanations

## Human/testing involvement

- User enters pet data and selects AI suggestions
- User reviews outputs before accepting tasks
- Automated tests verify reliability and guardrails

**Image:** `assets/uml_final.jpg` (final UML diagram)

- Input 1: dog, 90 minutes available, feeding + walk tasks

# Slide 6: AI Feature Behavior

## How the AI works

- Uses pet species, age, name, and owner availability
- Generates 5-6 personalized care tasks
- Each recommendation includes:
  - `title`
  - `duration_minutes`
  - `priority`
  - `recurrence`
- Limits output to 8 recommendations maximum

## Demo actions

- Click "Get AI Suggestions"
- Review generated tasks
- Select tasks to add to the schedule

**Image:** `assets/pic5.jpg` or `assets/pic6.jpg` (AI result screenshot)

---

# Slide 7: Reliability and Guardrails

## Reliability features

- Graceful fallback when `GOOGLE_API_KEY` is missing
- Robust parsing for AI responses
- Validation of structure, priorities, and recurrence
- Recovery logic for truncated or malformed JSON

## Testing and evaluation

- Automated tests cover scheduling, persistence, conflict detection, and AI behavior
- Errors are surfaced in console/logs for developer debugging

**Image:** `assets/pic6.jpg` or `assets/pic3b.jpg` (error/debug UI)

---

# Slide 8: Responsible AI Reflection

## Limitations and bias

- AI suggestions depend on prompt wording and may be generic
- Unusual pets or specialized medical needs may not be handled accurately

## Misuse and prevention

- Risk: users may trust AI suggestions without vet review
- Prevent by keeping humans in control, providing clear guidance, and encouraging verification

## Reliability insight

- Surprise: AI output can be wrapped in markdown or cut off unexpectedly
- Improvement: prompt simplification and parsing safeguards made the feature much more robust

---

# Slide 9: Collaboration with AI

## Helpful AI support

- AI helped design the recommendation prompt
- It suggested a structured JSON format and task-example patterns

## Flawed AI behavior

- AI output sometimes returned markdown wrappers or incomplete JSON
- This required manual debugging and stronger validation

## Collaboration takeaways

- AI acted as a development partner, not a final decision-maker
- Human review was essential for reliability and correctness

---

# Slide 10: Summary and Next Steps

## Recap

- Base project: pet care scheduler with recurrence, priorities, and conflict detection
- Extension: Gemini 2.5 Flash AI recommendations and JSON persistence
- Reliability: parsing guards, fallback behavior, and test coverage

## Next improvements

- Add multi-pet aggregated scheduling
- Add user-specific health/medication rules
- Add richer AI explanation feedback in the UI
